<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket2Cash — Afriland First Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --brand:#C1121F; --brand-600:#A50F1A; --brand-700:#8A0C15; --brand-tint:#FDECEE;
  --font-sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-display:'Plus Jakarta Sans',var(--font-sans);
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sidebar-w:266px; --topbar-h:64px;
  --ok:#127A45; --ok-bg:#E6F4EC;
  --warn:#B25E09; --warn-bg:#FBEFDD;
  --info:#1553B8; --info-bg:#E7F0FE;
  --danger:#B42318; --danger-bg:#FCE9E7;
  --muted-badge:#5A6472; --muted-bg:#EEF1F5;
}
/* ---------- LIGHT: whole shell light ---------- */
html[data-theme="light"]{
  --bg:#F4F6FA; --bg-grad:radial-gradient(1100px 480px at 82% -12%, #fbe9ea 0%, transparent 62%);
  --surface:#FFFFFF; --surface-2:#F7F9FC; --elevated:#FFFFFF;
  --border:#E6EAF1; --border-strong:#D6DCE7;
  --text:#101828; --text-2:#48566B; --muted:#8A94A6;
  /* sidebar = light */
  --side-bg:#FFFFFF; --side-text:#48566B; --side-strong:#101828; --side-muted:#98A2B3;
  --side-hover:#F2F5FA; --side-border:#E6EAF1;
  --logo-chip:#FFFFFF; --logo-border:#E6EAF1;
  --logout-bg:#FDECEE; --logout-text:#B42318; --logout-border:#F6CDD1;
  --input-bg:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 16px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.14);
}
/* ---------- DARK: whole shell dark ---------- */
html[data-theme="dark"]{
  --bg:#090C12; --bg-grad:radial-gradient(1100px 480px at 82% -12%, rgba(193,18,31,.15) 0%, transparent 62%);
  --surface:#12161F; --surface-2:#161C27; --elevated:#161C27;
  --border:#232B39; --border-strong:#2C3648;
  --text:#E9EDF5; --text-2:#AEB7C6; --muted:#727D90;
  /* sidebar = dark */
  --side-bg:#0D121A; --side-text:#AEB7C6; --side-strong:#F1F4FA; --side-muted:#6B7688;
  --side-hover:rgba(255,255,255,.05); --side-border:#1E2531;
  --logo-chip:#FFFFFF; --logo-border:#2A3342;
  --logout-bg:rgba(193,18,31,.16); --logout-text:#FF8F96; --logout-border:rgba(193,18,31,.28);
  --input-bg:#0E1219;
  --ok-bg:#0e2a1c; --warn-bg:#2c1f0d; --info-bg:#0f1f3a; --danger-bg:#2c1512; --muted-bg:#1a2130;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 16px 46px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease;
}
/* global smooth theme transition */
.sidebar,.topbar,.panel,.kpi,.table-wrap,.nav-item,.btn,input,select,.badge,thead th,tbody td{
  transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
::selection{background:var(--brand-tint);color:var(--brand-700)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:padding-box}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{
  background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:60;border-right:1px solid var(--side-border);
}
.main{min-width:0;display:flex;flex-direction:column}

/* ---- Brand / logo (Afriland only) ---- */
.brand-box{padding:22px 18px 16px;display:flex;align-items:center;justify-content:center}
.brand-logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:78px}
.brand-logo img{height:72px;max-width:100%;object-fit:contain;transition:filter .18s ease}
/* Light sidebar -> original logo. Dark sidebar -> white logo (same trick as the login page). */
html[data-theme="dark"] .brand-logo img{filter:brightness(0) invert(1)}
.brand-logo .fallback{font-family:var(--font-display);font-weight:800;color:var(--brand);font-size:20px;text-align:center;line-height:1.15}
html[data-theme="dark"] .brand-logo .fallback{color:#fff}
.logo-divider{height:1px;background:var(--side-border);margin:2px 16px 10px}

/* ---- Sidebar search ---- */
.side-search{padding:0 14px 12px;position:relative}
.side-search svg{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--side-muted)}
.side-search input{
  width:100%;background:var(--side-hover);border:1px solid var(--side-border);color:var(--side-strong);
  border-radius:10px;padding:9px 12px 9px 34px;font-size:13px
}
.side-search input::placeholder{color:var(--side-muted)}
.side-search input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
html[data-theme="dark"] .side-search input:focus{box-shadow:0 0 0 3px rgba(193,18,31,.14)}

/* ---- Nav ---- */
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border-strong)}
.nav-group{margin-top:14px}
.nav-group h4{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--side-muted);font-weight:700;padding:0 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--side-text);
  font-size:13.5px;font-weight:500;margin-bottom:1px;position:relative;cursor:pointer
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.8}
.nav-item:hover{background:var(--side-hover);color:var(--side-strong)}
.nav-item.active{background:linear-gradient(90deg,var(--brand) 0%,var(--brand-600) 100%);color:#fff;box-shadow:0 6px 16px rgba(193,18,31,.32)}
.nav-item.active svg{opacity:1}

/* ---- Sidebar footer ---- */
.side-footer{padding:12px 14px 16px;border-top:1px solid var(--side-border)}
.side-footer .profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.side-footer .profile:hover{background:var(--side-hover)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f2545b);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 34px}
.side-footer .who{min-width:0}
.side-footer .who b{display:block;font-size:13px;color:var(--side-strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-footer .who small{color:var(--side-muted);font-size:11px}
.btn-logout{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:10px;background:var(--logout-bg);color:var(--logout-text);font-size:13px;font-weight:600;border:1px solid var(--logout-border)}
.btn-logout:hover{background:var(--brand);color:#fff;border-color:transparent}

/* ============ TOPBAR ============ */
.topbar{
  height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:40
}
.hamburger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);align-items:center;justify-content:center;flex:0 0 38px;color:var(--text)}
.hamburger:hover{background:var(--surface-2)}
.tb-brand{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.tb-brand span{color:var(--brand)}
.tb-role{font-size:12px;font-weight:600;color:var(--brand-700);background:var(--brand-tint);padding:3px 10px;border-radius:20px;white-space:nowrap}
html[data-theme="dark"] .tb-role{background:rgba(193,18,31,.18);color:#ff9ba1}
.tb-search{flex:1;max-width:440px;position:relative;min-width:0}
.tb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.tb-search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:10px 12px 10px 38px;color:var(--text)}
.tb-search input::placeholder{color:var(--muted)}
.tb-search input:focus{border-color:var(--brand);background:var(--surface);outline:none;box-shadow:0 0 0 4px var(--brand-tint)}
html[data-theme="dark"] .tb-search input:focus{box-shadow:0 0 0 4px rgba(193,18,31,.16)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-date{font-size:11.5px;color:var(--text-2);text-align:right;line-height:1.25;white-space:nowrap}
.tb-date b{display:block;color:var(--text);font-weight:600;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid transparent;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--brand);border-radius:50%;border:2px solid var(--surface)}
.lang-sel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-size:12.5px;font-weight:500}

/* ============ CONTENT ============ */
.content{padding:24px 28px 40px;flex:1}
.page-head{margin-bottom:22px}
.page-head h1{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--text-2);font-size:14px;margin-top:4px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(193,18,31,.28)}
.btn-primary:hover{background:var(--brand-600)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.kpi::before{content:none}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong);transition:transform .18s,box-shadow .18s}
.kpi .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px}
.kpi .kpi-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand);flex:0 0 38px}
html[data-theme="dark"] .kpi .kpi-icon{background:rgba(193,18,31,.16)}
.kpi .kpi-icon svg{width:20px;height:20px}
.kpi .kpi-label{font-size:12.5px;color:var(--text-2);font-weight:500}
.kpi .kpi-val{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.kpi .kpi-sub{font-size:12px;color:var(--muted);margin-top:8px}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.panel-head h3{font-family:var(--font-display);font-size:15px;font-weight:700}
.panel-head .link{font-size:12.5px;color:var(--brand);font-weight:600;cursor:pointer}
.panel-body{padding:16px 18px}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.table-toolbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.table-toolbar .count-pill{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:4px 11px;border-radius:20px;font-weight:600}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 18px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td .mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-2)}
td .strong{font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-warn{color:var(--warn);background:var(--warn-bg)}
.b-info{color:var(--info);background:var(--info-bg)} .b-danger{color:var(--danger);background:var(--danger-bg)}
.b-muted{color:var(--muted-badge);background:var(--muted-bg)}

.legend{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.legend .row{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .row .sw{width:10px;height:10px;border-radius:3px}
.legend .row b{margin-left:auto;font-weight:700}

.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:6px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-line{height:12px;margin:8px 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .3s ease both}
.empty{padding:52px 24px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.5}
.empty h4{font-size:15px;color:var(--text);font-weight:700;margin-bottom:5px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}

.profile-card{max-width:640px}
.pf-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.pf-row:last-child{border:none}
.pf-row .k{color:var(--text-2);font-size:13.5px}
.pf-row .v{font-weight:600;font-family:var(--font-mono);font-size:13px}

.overlay{display:none;position:fixed;inset:0;background:rgba(4,4,8,.5);z-index:55;backdrop-filter:blur(2px)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--elevated);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:500;z-index:100;animation:fadeUp .25s;max-width:340px;color:var(--text)}
.toast.err{border-left:3px solid var(--brand)} .toast.ok{border-left:3px solid var(--ok)}
.tree-toggle{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;margin-right:8px;transition:transform .15s;color:var(--muted);vertical-align:middle}
.partner-row{cursor:pointer}
.partner-row.open .tree-toggle{transform:rotate(90deg)}
.partner-row:hover{background:var(--surface-2)}
.child-row{display:none}
.child-row.show{display:table-row}
.child-row td:first-child{padding-left:46px;color:var(--text-2)}
.cred-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cred-box .k{font-size:12px;color:var(--muted);font-weight:600}
.cred-box .v{font-family:var(--font-mono);font-weight:600;font-size:14px;word-break:break-all}

/* ---- avatar image ---- */
.avatar img,.avatar-lg img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.avatar-lg{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f2545b);display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px;overflow:hidden;flex:0 0 84px;position:relative}
.tb-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--brand),#f2545b);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--border)}
/* ---- tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
/* --- Field validation feedback (V7) --- */
.field input.invalid,
.field select.invalid,
.field textarea.invalid,
input.invalid, select.invalid, textarea.invalid {
  border-color: var(--brand) !important;
  background: rgba(193, 18, 31, 0.06) !important;
  box-shadow: 0 0 0 3px rgba(193, 18, 31, 0.08);
  transition: all 0.15s;
}
.field-error {
  color: var(--brand);
  font-size: 11.5px;
  font-weight: 500;
  margin-top: 4px;
  display: none;
  line-height: 1.4;
}
.field-error.show { display: block; }
.field-error::before { content: "⚠ "; font-weight: 700; }
/* ---- forms ---- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);width:100%;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
html[data-theme="dark"] .field input:focus,html[data-theme="dark"] .field select:focus{box-shadow:0 0 0 3px rgba(193,18,31,.16)}
.field .hint{font-size:11.5px;color:var(--muted)}
.info-banner{background:var(--info-bg);border:1px solid transparent;border-radius:12px;padding:12px 16px;font-size:13px;color:var(--text-2);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.info-banner svg{width:18px;height:18px;color:var(--info);flex:0 0 18px;margin-top:1px}
.info-banner b{color:var(--text)}
/* ---- product toolbar ---- */
.prod-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.prod-toolbar .grow{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--text-2);background:var(--surface);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface-2);color:var(--text)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.mini-btn{padding:6px 11px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.mini-btn:hover{background:var(--surface-2)}
.mini-btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-bg)}
/* ---- modal ---- */
.modal-back{position:fixed;inset:0;background:rgba(6,8,12,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px);animation:fadeUp .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-family:var(--font-display);font-size:16px;font-weight:700}
.modal-head .x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.modal-head .x:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);background:var(--surface-2)}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:1024px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;width:290px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .overlay{display:block}
  .hamburger{display:flex}
}
@media(max-width:720px){.content{padding:18px 16px 34px}.tb-search{display:none}.tb-date{display:none}.lang-sel{display:none}.page-head h1{font-size:22px}}
@media(max-width:560px){.kpi-grid{grid-template-columns:1fr}.tb-role{display:none}}
</style>

<body>
<div class="overlay" onclick="closeNav()"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand-box">
      <div class="brand-logo">
        <img src="/assets/logo-afriland.png" alt="Afriland First Bank"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="fallback" style="display:none">Afriland<br>First Bank</div>
      </div>
    </div>
    <div class="logo-divider"></div>
    <div class="side-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="navSearch" oninput="filterNav(this.value)">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-footer">
      <div class="profile" onclick="go('account')">
        <div class="avatar" id="sideAvatar">A</div>
        <div class="who"><b id="sideName">Admin</b><small id="sideRole">ADMIN</small></div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span id="logoutTxt">Déconnexion</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" onclick="openNav()" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="tb-brand">Ticket<span>2</span>Cash</div>
      <div class="tb-role" id="tbRole">Admin</div>
      <div class="tb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" oninput="tableSearch(this.value)">
      </div>
      <div class="tb-right">
        <div class="tb-date"><b id="dateMain">—</b><span id="dateSub"></span></div>
        <select class="lang-sel" id="lang" onchange="setLang(this.value)">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
        <button class="icon-btn" title="Notifications"><span class="dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Theme"></button>
        <div class="tb-avatar" id="tbAvatar" onclick="go('account')" title="Compte">A</div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

/* ============ API + FORMAT ============ */
async function api(path,opts={}){
  const res=await fetch(API+path,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opts));
  if(res.status===401){location.href="/login.html";throw new Error("unauth");}
  const txt=await res.text();
  if(!res.ok)throw new Error(txt||res.status);
  try{return txt?JSON.parse(txt):null;}catch(_){return txt;}
}
const nf=new Intl.NumberFormat("fr-FR");
function money(v){if(v==null||v==="")return "—";return nf.format(Math.round(Number(v)))+" FCFA";}
function num(v){return v==null?"0":nf.format(Number(v));}
function dt(v){if(!v)return "—";const d=new Date(v);if(isNaN(d))return v;return d.toLocaleDateString(LANG==="fr"?"fr-FR":"en-US",{day:"2-digit",month:"short",year:"numeric"});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function badge(status){
  const s=String(status||"").toUpperCase();
  const map={ACTIVE:"b-ok",VALIDATED:"b-ok",SUCCESS:"b-ok",PAID:"b-ok",APPROVED:"b-ok",OCR_PROCESSED:"b-ok",RESOLVED:"b-ok",
    PENDING:"b-warn",OCR_PENDING:"b-warn",PAUSED:"b-warn",UNDER_REVIEW:"b-warn",SUBMITTED:"b-info",
    DRAFT:"b-muted",EXPIRED:"b-muted",CLOSED:"b-muted",OPEN:"b-danger",REJECTED:"b-danger",FAILED:"b-danger",SUSPENDED:"b-danger",
    ADMIN:"b-info",PARTNER:"b-ok",OPERATEUR:"b-warn",LECTEUR:"b-muted"};
  return `<span class="badge ${map[s]||"b-muted"}">${esc(stLabel(status))}</span>`;
}
function head(title,sub,actions){return `<div class="page-head"><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:""}${actions?`<div class="page-actions">${actions}</div>`:""}</div>`;}
function refreshBtn(){return `<button class="btn btn-ghost" onclick="go('${CURRENT}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>${t("refresh")}</button>`;}

function loyBatchActions(b){
  const s = b.status;
  const btns = [];
  btns.push(`<button class="mini-btn" onclick="loyOpenBatchDetails(${b.id})">Voir</button>`);
  if (s === "IMPORTED" || s === "CALCULATED" || s === "FAILED")
    btns.push(`<button class="mini-btn" onclick="loyOpenCalcModal(${b.id})">Calculer</button>`);
  if (s === "CALCULATED")
    btns.push(`<button class="mini-btn" style="color:var(--ok)" onclick="loyApproveBatch(${b.id})">Approuver</button>`);
  if (s === "APPROVED")
    btns.push(`<button class="mini-btn" style="color:var(--brand)" onclick="loyCreditBatch(${b.id})">Créditer</button>`);
  if (s !== "CREDITED")
    btns.push(`<button class="mini-btn danger" onclick="loyDeleteBatch(${b.id})">Suppr.</button>`);
  return btns.join(" ");
}

function loyStatusBadge(s){
  const u = String(s||"").toUpperCase();
  const map = { IMPORTED:"b-info", CALCULATING:"b-warn", CALCULATED:"b-info", APPROVED:"b-warn",
    CREDITED:"b-ok", REJECTED:"b-danger", FAILED:"b-danger",
    PENDING:"b-warn", QUEUED:"b-info", CANCELLED:"b-muted", ACTIVE:"b-ok", INACTIVE:"b-muted" };
  const label = { IMPORTED:"Importé", CALCULATING:"Calcul…", CALCULATED:"Calculé",
    APPROVED:"Approuvé", CREDITED:"Crédité", REJECTED:"Rejeté", FAILED:"Échoué",
    PENDING:"En attente", QUEUED:"En file", CANCELLED:"Annulé", ACTIVE:"Actif", INACTIVE:"Inactif" };
  return `<span class="badge ${map[u]||"b-muted"}">${label[u]||u}</span>`;
}

async function loyUploadBatch(){
  const name = document.getElementById("loyUpName").value.trim();
  const fInput = document.getElementById("loyUpFile");
  const file = fInput && fInput.files[0];
  if (!file){ toast("Sélectionnez un fichier", "err"); return; }
  const fd = new FormData();
  fd.append("file", file);
  fd.append("name", name || file.name);
  try{
    toast("Import en cours…");
    const res = await fetch("/api/loyalty/batches/upload", { method:"POST", credentials:"same-origin", body:fd });
    if (!res.ok) throw new Error(await res.text() || res.status);
    const b = await res.json();
    toast(`Batch importé — ${b.parsedRows} lignes`, "ok");
    await loyRefreshAll(); loyRenderKpis(); loyRenderBatches();
  }catch(e){ toast("Erreur import: " + e.message, "err"); }
}

function loyOpenCalcModal(batchId){
  const active = LOY.rules.filter(r => r.active);
  if (active.length === 0){ toast("Aucune règle active. Créez-en une d'abord.", "err"); return; }
  openModal("Appliquer une règle",
    `<div style="margin-bottom:14px"><label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">Règle de cashback</label>

    await loyRefreshAll(); loyRenderKpis(); loyRenderBatches();

async function loySaveRule(id){
  const body = {
    name: val("loyRName"),
    description: val("loyRDesc"),
    type: document.getElementById("loyRType").value,
    active: document.getElementById("loyRActive").value === "true"
  };
  const pct = val("loyRPct"); if (pct) body.percentage = parseFloat(pct);
  const tiers = val("loyRTiers"); if (tiers) body.tiersJson = tiers;
  const cat = val("loyRCat"); if (cat) body.categoryFilter = cat;
  const minTx = val("loyRMinTx"); if (minTx) body.minTransactionAmount = parseFloat(minTx);
  const minPer = val("loyRMinPer"); if (minPer) body.minPeriodVolume = parseFloat(minPer);
  const max = val("loyRMax"); if (max) body.maxCashbackPerClient = parseFloat(max);
  const tf = val("loyRTierFilter"); if (tf) body.tierFilter = tf;
  const entSel = document.getElementById("loyREntity"); if (entSel && entSel.value) body.entityTypeFilter = entSel.value;
  const mtc = val("loyRMinTxCount"); if (mtc) body.minTransactionCount = parseInt(mtc);
  const mav = val("loyRMinAvg"); if (mav) body.minAvgTransactionValue = parseFloat(mav);
  const mtn = val("loyRMinTenure"); if (mtn) body.minAccountAgeMonths = parseInt(mtn);
  if (!body.name){ toast("Nom requis", "err"); return; }
  try{
    const method = id ? "PUT" : "POST";
    const url = id ? `/api/loyalty/rules/${id}` : "/api/loyalty/rules";
    await api(url, { method, body: JSON.stringify(body) });
    toast("Règle enregistrée", "ok");
    closeModal();
    await loyRefreshAll(); loyRenderKpis(); loyRenderRules();
  }catch(e){ toast("Erreur: " + e.message, "err"); }
}

async function loyDeleteRule(id){

function renderRecentClaims(claims){

function donut(data){
  const total=data.reduce((a,b)=>a+b.v,0)||1;let acc=0;const R=52,C=2*Math.PI*R;
  const segs=data.map(d=>{const frac=d.v/total,dash=frac*C,seg=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${d.c}" stroke-width="18" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 70 70)"/>`;acc+=frac;return seg;}).join("");
  return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="flex:0 0 140px">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--border)" stroke-width="18"/>${segs}
    <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)" font-family="Plus Jakarta Sans">${total}</text>
    <text x="70" y="84" text-anchor="middle" font-size="10" fill="var(--muted)">${t("claims_lc")}</text></svg>
    <div class="legend" style="flex:1;min-width:160px">${data.map(d=>`<div class="row"><span class="sw" style="background:${d.c}"></span>${d.k}<b>${d.v}</b></div>`).join("")}</div></div>`;
}

  const addClick = key==="merchants" ? "merchantModal()" : `toast(t('form_soon')+' ${cfg.ep}','ok')`;
  const actions=(canAdd?`<button class="btn btn-primary" onclick="${addClick}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>${t("add")}</button>`:"")+refreshBtn();
  c.innerHTML=`<div class="page">${head(t(cfg.title),t(cfg.sub),actions)}
    <div class="table-wrap"><div class="table-toolbar"><span class="count-pill" id="cp">—</span></div>
    <div class="table-scroll"><table><thead><tr>${cfg.cols.map(col=>`<th>${t(col[1])}</th>`).join("")}</tr></thead>
    <tbody id="tbody">${rowSkeleton(cfg.cols.length,6)}</tbody></table></div></div></div>`;
  try{
    let rows=await api(EP);
    if(!Array.isArray(rows))rows=rows&&rows.content?rows.content:[];
    CACHE[key]=rows; paintRows(key,rows);
  }catch(e){document.getElementById("tbody").innerHTML=`<tr><td colspan="${cfg.cols.length}">${emptyMini(t("err_load"))}</td></tr>`;document.getElementById("cp").textContent="0";}
}
function cell(row,col){
  const [field,,type]=col;let v=row[field];
  switch(type){
    case "strong":return `<span class="strong">${esc(v||"—")}</span>`;
    case "mono":return `<span class="mono">${esc(v||"—")}</span>`;
    case "money":return money(v);
    case "date":return `<span style="color:var(--text-2)">${dt(v)}</span>`;
    case "badge":return badge(v);
    case "bool":return v?`<span class="badge b-ok">${t("yes")}</span>`:`<span class="badge b-muted">${t("no")}</span>`;
    case "lock":return v?`<span class="badge b-danger">${t("locked")}</span>`:`<span class="badge b-ok">${t("active_word")}</span>`;
    case "numval":return `<span class="strong">${esc(v??"—")}${row.cashbackType==="PERCENTAGE"?" %":""}</span>`;
    case "risk":{const n=Number(v)||0,cl=n>=70?"b-danger":n>=40?"b-warn":"b-ok";return `<span class="badge ${cl}">${n}</span>`;}
    case "chain":return merchantChain(v);
    case "parentname":return v!=null&&MMAP[v]?`<span class="badge b-info">${esc(MMAP[v].name)}</span>`:`<span style="color:var(--muted)">—</span>`;
    default:return esc(v==null?"—":v);
  }
}
function paintRows(key,rows){
  const cfg=TABLES[key],tb=document.getElementById("tbody"),cp=document.getElementById("cp");if(!tb)return;
  cp.textContent=rows.length+" "+t("items");
  if(!rows.length){tb.innerHTML=`<tr><td colspan="${cfg.cols.length}">${emptyFull()}</td></tr>`;return;}
  tb.innerHTML=rows.map(r=>`<tr>${cfg.cols.map(col=>`<td>${cell(r,col)}</td>`).join("")}</tr>`).join("");
}

async function renderUsers(){
  const el = document.getElementById("content");
  const canManage = ME.role === "ADMIN";
  el.innerHTML = `<div class="page">${head(t("users"), t("users_sub"),
    (canManage ? `<button class="btn btn-primary" onclick="usrModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>${t("adduser_btn")||"Ajouter"}</button>` : "") + refreshBtn())}
    <div class="kpi-grid" style="margin-bottom:16px">
      <div class="kpi-card"><div class="kpi-label">Total</div><div class="kpi-value" id="uKpiTotal">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Admins</div><div class="kpi-value" id="uKpiAdmin">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Partenaires</div><div class="kpi-value" id="uKpiPartner">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Verrouillés</div><div class="kpi-value" id="uKpiLocked">—</div></div>
    </div>
    <div id="uDiag" style="display:none;padding:14px 18px;margin-bottom:14px;border-radius:10px;background:#FEF2F2;border-left:4px solid var(--brand);color:#7F1D1D;font-size:13px;font-family:'Consolas',monospace;white-space:pre-wrap"></div>
    <div class="table-wrap"><div class="table-toolbar"><span class="count-pill" id="uCp">—</span></div>
    <div class="table-scroll"><table><thead><tr><th>${t("c_username")||"Utilisateur"}</th><th>${t("c_fullname")||"Nom complet"}</th><th>${t("c_email")||"Email"}</th><th>${t("c_role")||"Rôle"}</th><th>${t("c_locked")||"État"}</th><th>${t("c_lastlogin")||"Dernière connexion"}</th><th style="text-align:right">${t("actions")||"Actions"}</th></tr></thead>
    <tbody id="uBody">${rowSkeleton(6, 6)}</tbody></table></div></div></div>`;

  // Try to fetch — with detailed diagnostic
  let rows;
  try {
    const resp = await fetch("/api/auth/users", { credentials: "same-origin", headers: { "Accept": "application/json" } });
    if (!resp.ok) {
      // Show detailed diagnostic
      let details = "";
      try { const j = await resp.json(); details = "\n" + JSON.stringify(j, null, 2); }
      catch(_) { try { details = "\n" + (await resp.text()).slice(0, 400); } catch(_) {} }
      const diag = document.getElementById("uDiag");
      let msg = `⚠ Erreur HTTP ${resp.status} sur GET /api/auth/users`;
      if (resp.status === 401) msg += "\n→ Session expirée ou non authentifié. Reconnectez-vous.";
      else if (resp.status === 403) msg += "\n→ Rôle insuffisant (seul ADMIN peut voir cette page).";
      else if (resp.status === 404) msg += "\n→ L'endpoint /api/auth/users n'existe pas côté backend.\n→ Vérifier AuthController.java ou consulter les logs serveur.";
      else if (resp.status >= 500) msg += "\n→ Erreur serveur. Consulter /var/log/ticket2cash.log";
      msg += details;
      diag.textContent = msg;
      diag.style.display = "block";
      document.getElementById("uBody").innerHTML = `<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--muted)">Consultez le diagnostic ci-dessus</td></tr>`;
      document.getElementById("uCp").textContent = "0";
      return;
    }
    rows = await resp.json();
  } catch(e) {
    const diag = document.getElementById("uDiag");
    diag.textContent = `⚠ Erreur réseau lors du chargement:\n${e.message || e}\n→ Vérifiez que le serveur est démarré.`;
    diag.style.display = "block";
    document.getElementById("uBody").innerHTML = `<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--muted)">Consultez le diagnostic ci-dessus</td></tr>`;
    document.getElementById("uCp").textContent = "0";
    return;
  }

  if (!Array.isArray(rows)) rows = rows && rows.content ? rows.content : [];
  window.__users = rows;

  // KPIs
  document.getElementById("uKpiTotal").textContent = rows.length;
  document.getElementById("uKpiAdmin").textContent = rows.filter(u => u.role === "ADMIN").length;
  document.getElementById("uKpiPartner").textContent = rows.filter(u => u.role === "PARTNER").length;
  document.getElementById("uKpiLocked").textContent = rows.filter(u => u.accountLocked).length;

  document.getElementById("uCp").textContent = rows.length + " utilisateur(s)";
  document.getElementById("uBody").innerHTML = rows.length ? rows.map(u => `
    <tr>
      <td class="strong">${esc(u.username || "—")}</td>
      <td>${esc(u.fullName || "—")}</td>
      <td><span class="mono" style="font-size:12px">${esc(u.email || "—")}</span></td>
      <td>${usrRoleBadge(u.role)}</td>
      <td>${u.accountLocked ? '<span class="badge b-danger">🔒 Verrouillé</span>' : '<span class="badge b-ok">✓ Actif</span>'}</td>
      <td style="color:var(--text-2);font-size:12px">${u.lastLoginAt ? dt(u.lastLoginAt) : "—"}</td>
      <td class="row-actions">${canManage ? `
        ${u.accountLocked
          ? `<button class="mini-btn" onclick="usrUnlock(${u.id})">Déverrouiller</button>`
          : `<button class="mini-btn danger" onclick="usrLock(${u.id})">Verrouiller</button>`}
        <button class="mini-btn" onclick="usrModal(${u.id})">Modifier</button>
        ${u.username !== ME.username ? `<button class="mini-btn danger" onclick="usrDelete(${u.id},'${esc(u.username)}')">Supprimer</button>` : ''}
      ` : ""}</td>
    </tr>`).join("") : `<tr><td colspan="7">${emptyFull()}</td></tr>`;
}

function usrToggleMerchant(){
  const r = val("usr_role");
  const w = document.getElementById("usr_merchant_wrap");
  if (w) w.style.display = r === "PARTNER" ? "flex" : "none";
}

async function usrSave(id){
  const body = {
    username: val("usr_username"),
    fullName: val("usr_fullname"),
    email: val("usr_email"),
    role: val("usr_role")
  };
  const pwd = val("usr_password");
  if (pwd) body.password = pwd;
  const mid = val("usr_merchant");

  if (!body.username || !body.fullName || !body.email || !body.role) {
    toast("Tous les champs marqués * sont requis", "err"); return;
  }
  if (!id && !pwd) { toast("Mot de passe requis pour un nouvel utilisateur", "err"); return; }
  if (body.role === "PARTNER" && !mid) { toast("Marchand requis pour un partenaire", "err"); return; }

  try {
    const res = await api(id ? `/api/auth/users/${id}` : "/api/auth/users",
      { method: id ? "PUT" : "POST", body: JSON.stringify(body) });
    // Assign merchant if partner
    if (body.role === "PARTNER") {
      const uid = id || (res && (res.id || res.userId));
      if (uid && mid) {
        try { await api(`/api/auth/users/${uid}/merchant?merchantId=${mid}`, { method: "PUT" }); }
        catch(_) {}
      }
    }
    toast(id ? "Utilisateur mis à jour" : "Utilisateur créé", "ok");
    closeModal(); renderUsers();
  } catch(e) {
    let m = String(e.message || e);
    try { const j = JSON.parse(m); if (j.error) m = j.error; } catch(_) {}
    toast(m.slice(0, 200), "err");
  }
}

async function usrLock(id){
  if (!confirm("Verrouiller cet utilisateur ? Il ne pourra plus se connecter.")) return;
  try {
    await api(`/api/auth/users/${id}/lock`, { method: "POST" });
    toast("Utilisateur verrouillé", "ok");
    renderUsers();
  } catch(e) { toast(String(e.message || e).slice(0, 200), "err"); }
}

async function usrUnlock(id){
  try {
    await api(`/api/auth/users/${id}/unlock`, { method: "POST" });
    toast("Utilisateur déverrouillé", "ok");
    renderUsers();
  } catch(e) { toast(String(e.message || e).slice(0, 200), "err"); }
}

async function usrDelete(id, username){
  if (!confirm(`Supprimer définitivement l'utilisateur "${username}" ?\nCette action est irréversible.`)) return;
  try {
    await api(`/api/auth/users/${id}`, { method: "DELETE" });
    toast("Utilisateur supprimé", "ok");
    renderUsers();
  } catch(e) { toast(String(e.message || e).slice(0, 200), "err"); }
}

/* --- Field validation library (V7) --- */
const FIELD_VALIDATORS = {
  name: v => {
    if (!v || !v.trim()) return "Ce champ est requis";
    const t = v.trim();
    if (t.length < 2) return "Au moins 2 caractères";
    if (t.length > 200) return "Maximum 200 caractères";
    if (!/[\p{L}]/u.test(t)) return "Doit contenir au moins une lettre";
    return null;
  },
  sku: v => {
    if (!v) return null;
    if (!/^[A-Za-z0-9._\-]{1,60}$/.test(v.trim())) return "Lettres, chiffres, . _ - (60 max)";
    return null;
  },
  email: v => {
    if (!v) return null;
    if (!/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(v.trim())) return "Format email invalide";
    return null;
  },
  requiredEmail: v => {
    if (!v || !v.trim()) return "L'email est requis";
    return FIELD_VALIDATORS.email(v);
  },
  phone: v => {
    if (!v) return null;
    if (!/^[+]?[0-9\s.\-]{7,20}$/.test(v.trim())) return "Format téléphone invalide";
    return null;
  },
  username: v => {
    if (!v || !v.trim()) return "Nom d'utilisateur requis";
    const t = v.trim();
    if (/^[A-Za-z0-9._\-]{3,40}$/.test(t)) return null;
    if (/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(t)) return null;
    return "3-40 caractères (lettres, chiffres, . _ -) ou email";
  },
  password: v => {
    if (!v) return "Mot de passe requis";
    if (v.length < 8) return "Au moins 8 caractères";
    return null;
  },
  percentage: v => {
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return "Nombre invalide";
    if (n < 0) return "Doit être ≥ 0";
    if (n > 100) return "Doit être ≤ 100";
    return null;
  },
  positive: v => {
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return "Nombre invalide";
    if (n <= 0) return "Doit être strictement positif";
    return null;
  },
  positiveOrZero: v => {
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return "Nombre invalide";
    if (n < 0) return "Doit être ≥ 0";
    return null;
  },
  minText: (v, min) => {
    if (!v || !v.trim()) return "Ce champ est requis";
    if (v.trim().length < min) return `Au moins ${min} caractères`;
    return null;
  },
  account: v => {
    if (!v || !v.trim()) return "Numéro de compte requis";
    if (!/^[A-Za-z0-9]{5,30}$/.test(v.trim())) return "5-30 caractères alphanumériques";
    return null;
  }
};

function validateField(input, validatorType) {
  const validator = FIELD_VALIDATORS[validatorType];
  if (!validator) return true;
  const err = validator(input.value);
  const errEl = input.parentElement && input.parentElement.querySelector(".field-error");
  if (err) {
    input.classList.add("invalid");
    if (errEl) { errEl.textContent = err; errEl.classList.add("show"); }
    return false;
  } else {
    input.classList.remove("invalid");
    if (errEl) { errEl.classList.remove("show"); errEl.textContent = ""; }
    return true;
  }
}

/* Helper: attach live validation to all inputs with data-validate inside a container. */
function wireLiveValidation(rootSelector) {
  const root = typeof rootSelector === "string" ? document.querySelector(rootSelector) : rootSelector;
  if (!root) return;
  root.querySelectorAll("[data-validate]").forEach(input => {
    const type = input.getAttribute("data-validate");
    input.addEventListener("input", () => validateField(input, type));
    input.addEventListener("blur", () => validateField(input, type));
  });
}

function filteredProducts(){
  const q=PROD_STATE.q.toLowerCase(),cat=PROD_STATE.cat.toLowerCase(),mid=PROD_STATE.merchant;
  return (window.__products||[]).filter(p=>{
    if(mid&&String(p.merchant&&p.merchant.id)!==String(mid))return false;
    if(cat&&String(p.category||"").toLowerCase()!==cat)return false;
    if(q){const hay=[p.sku,p.name,p.brand,p.category,p.groupKey].join(" ").toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function paintProducts(){
  const rows=filteredProducts(),tb=document.getElementById("pBody");if(!tb)return;

async function submitProduct(id){

/* import / export */
const PCOLS=["sku","name","category","brand","price","groupKey","cashbackType","cashbackValue"];
function downloadCSV(name,text){const b=new Blob([text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}
function downloadTemplate(){downloadCSV("modele_produits.csv",PCOLS.join(",")+"\n");}
function exportProducts(fmt){
  const rows=filteredProducts();
  if(fmt==="csv"){const csv=[PCOLS.join(",")].concat(rows.map(p=>PCOLS.map(c=>`"${String(c==="cashbackType"?(p.cashbackType||""):p[c]??"").replace(/"/g,'""')}"`).join(","))).join("\n");downloadCSV("produits.csv",csv);}
  else{const html=`<table border="1"><tr>${PCOLS.map(c=>`<th>${c}</th>`).join("")}</tr>${rows.map(p=>`<tr>${PCOLS.map(c=>`<td>${esc(p[c]??"")}</td>`).join("")}</tr>`).join("")}</table>`;const b=new Blob([html],{type:"application/vnd.ms-excel"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="produits.xls";a.click();}
}
async function importMass(e){
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  const mid=PROD_STATE.merchant||(MERCH[0]&&MERCH[0].id);
  if(!mid){toast(t("kpi_merchant"),"err");return;}
  const text=await f.text();const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const hdr=lines.shift().split(",").map(h=>h.trim());
  let ok=0,fail=0;
  for(const line of lines){const cells=line.split(",");const row={};hdr.forEach((h,i)=>row[h]=(cells[i]||"").trim());
    try{await api(pEP(),{method:"POST",body:JSON.stringify({merchantId:Number(mid),sku:row.sku,name:row.name,category:row.category,brand:row.brand,price:row.price?Number(row.price):null,groupKey:row.groupKey,cashbackType:row.cashbackType||"NONE",cashbackValue:row.cashbackValue?Number(row.cashbackValue):0})});ok++;}catch(_){fail++;}}
  toast(`${t("import_done")} ${ok} ✓ / ${fail} ✗`,"ok");renderProducts();
}

/* ============ TENDANCES (analytics from real data) ============ */
function barChart(data,unit){
  const max=Math.max(1,...data.map(d=>d.v));
  return `<div style="display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:10px">${data.map(d=>{
    const h=Math.round((d.v/max)*150);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">
      <div style="font-size:11px;font-weight:700;color:var(--text-2)">${unit==="money"?money(d.v):num(d.v)}</div>
      <div style="width:100%;max-width:46px;height:${h}px;background:linear-gradient(180deg,var(--brand),#f2545b);border-radius:8px 8px 3px 3px"></div>
      <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(d.k)}</div>
    </div>`;}).join("")}</div>`;
}
async function renderTrends(){
  const c=document.getElementById("content");
  c.innerHTML=`<div class="page">${head(t("trends"),t("tr_sub"),refreshBtn())}
    <div class="grid-2">

    </div>
    <div class="panel"><div class="panel-head"><h3>${t("tr_top_cat")}</h3></div><div class="panel-body" id="trCat">${skLines(4)}</div></div></div>`;
  try{
    const [pays,claims,prods]=await Promise.all([
      api("/api/cashback/payments").catch(()=>[]),
      api("/api/claims").catch(()=>[]),
      api(pEP()).catch(()=>[])
    ]);
    // cashback by month
    const byM={};(Array.isArray(pays)?pays:[]).forEach(p=>{const d=p.processedAt||p.createdAt;if(!d)return;const key=new Date(d).toLocaleDateString(LANG==="fr"?"fr-FR":"en-US",{month:"short",year:"2-digit"});byM[key]=(byM[key]||0)+Number(p.amount||0);});
    const mData=Object.entries(byM).slice(-6).map(([k,v])=>({k,v}));
    document.getElementById("trCash").innerHTML=mData.length?barChart(mData,"money"):emptyMini(t("tr_no_data"));
    // claims by status
    const byS={};(Array.isArray(claims)?claims:[]).forEach(c2=>{const s=stLabel(c2.status);byS[s]=(byS[s]||0)+1;});
    const cols=["#1553B8","#127A45","#0E9F6E","#B42318","#B25E09"];
    const sData=Object.entries(byS).map(([k,v],i)=>({k,v,c:cols[i%cols.length]}));
    document.getElementById("trClaims").innerHTML=sData.length?donut(sData):emptyMini(t("tr_no_data"));
    // top product categories
    const byC={};(Array.isArray(prods)?prods:[]).forEach(p=>{const k=p.category||"—";byC[k]=(byC[k]||0)+1;});
    const cData=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({k,v}));
    document.getElementById("trCat").innerHTML=cData.length?barChart(cData,"num"):emptyMini(t("tr_no_data"));
  }catch(e){toast(t("err_load"),"err");}
}

function crudReadImage(event,fieldId){

  if(!file){return;}
  if(file.size>2*1024*1024){toast("Image trop grande (max 2MB)","err");event.target.value="";return;}
  const reader=new FileReader();
  reader.onload=function(){
    const dataUrl=reader.result;
    document.getElementById(fieldId).value=dataUrl;
    const prev=document.getElementById(fieldId+"_preview");
    if(prev) prev.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
  };
  reader.readAsDataURL(file);
}

function genPassword(){
  const U="ABCDEFGHJKLMNPQRSTUVWXYZ",L="abcdefghijkmnpqrstuvwxyz",D="23456789",A=U+L+D;
  let p=[U[Math.floor(Math.random()*U.length)],L[Math.floor(Math.random()*L.length)],D[Math.floor(Math.random()*D.length)]];
  for(let i=0;i<7;i++)p.push(A[Math.floor(Math.random()*A.length)]);
  return p.sort(()=>Math.random()-0.5).join("");
}

async function delMerchant(id,name){

function cmpUpdateCashbackHint(){
  const t=document.getElementById("cmp_cbtype")?.value;
  const lbl=document.getElementById("cmp_cbval_label");
  const hint=document.getElementById("cmp_cbval_hint");
  if(!lbl||!hint) return;
  if(t==="PERCENTAGE"){ lbl.textContent="Pourcentage (0-100) *"; hint.textContent="Ex: 2.5 pour 2.5%"; }
  else { lbl.textContent="Montant fixe (FCFA) *"; hint.textContent="Ex: 500 pour 500 FCFA par transaction"; }
}

function cmpUpdatePeriodHint(){
  const s=document.getElementById("cmp_start")?.value;
  const e=document.getElementById("cmp_end")?.value;
  const hint=document.getElementById("cmp_period_hint");
  if(!hint) return;
  if(!s||!e){ hint.textContent=""; return; }
  const d1=new Date(s), d2=new Date(e);
  if(d2<d1){ hint.style.color="var(--danger)"; hint.textContent="⚠️ La date de fin doit être après le début"; return; }
  const days=Math.round((d2-d1)/86400000)+1;
  hint.style.color="var(--muted)";
  hint.textContent=`Durée : ${days} jour${days>1?"s":""}`;
}

function cmpApplyPeriod(preset){
  const s=document.getElementById("cmp_start"), e=document.getElementById("cmp_end");
  const today=new Date(); today.setHours(0,0,0,0);
  const fmt=d=>d.toISOString().substring(0,10);
  let start, end;
  if(preset==="thisMonth"){
    start=new Date(today.getFullYear(),today.getMonth(),1);
    end=new Date(today.getFullYear(),today.getMonth()+1,0);
  } else if(preset==="nextMonth"){
    start=new Date(today.getFullYear(),today.getMonth()+1,1);
    end=new Date(today.getFullYear(),today.getMonth()+2,0);
  } else if(preset==="thisQuarter"){
    const q=Math.floor(today.getMonth()/3);
    start=new Date(today.getFullYear(),q*3,1);
    end=new Date(today.getFullYear(),q*3+3,0);
  } else if(preset==="thisYear"){
    start=new Date(today.getFullYear(),0,1);
    end=new Date(today.getFullYear(),11,31);
  } else if(preset==="next30"){
    start=new Date(today); end=new Date(today); end.setDate(end.getDate()+29);
  } else if(preset==="next90"){
    start=new Date(today); end=new Date(today); end.setDate(end.getDate()+89);
  } else return;
  s.value=fmt(start); e.value=fmt(end);
  cmpUpdatePeriodHint();
}

async function saveCampaign(){
  const draft=window.__cmpDraft;
  if(!draft){ toast("Session expirée","err"); return; }
  const tt=draft.triggerType;

  const body={
    name:val("cmp_name"),
    description:val("cmp_desc")||null,
    triggerType:tt,
    startDate:val("cmp_start")||null,
    endDate:val("cmp_end")||null,
    cashbackType:document.getElementById("cmp_cbtype").value,
    cashbackValue:val("cmp_cbval")?parseFloat(val("cmp_cbval")):null,
    totalBudget:val("cmp_budget")?parseFloat(val("cmp_budget")):null,
    status:document.getElementById("cmp_status").value,
    entityTypeFilter:val("cmp_entityFilter")||null,
    tierFilter:val("cmp_tierFilter")||null,
    minTransactionAmount:val("cmp_minTx")?parseFloat(val("cmp_minTx")):null,
    maxCashbackPerClient:val("cmp_maxCb")?parseFloat(val("cmp_maxCb")):null
  };

  // ADMIN provides merchantId; PARTNER doesn't (forced server-side)
  if(ME.role==="ADMIN"){
    const mid=val("cmp_merchant");
    if(!mid && !draft.isEdit){ toast("Choisissez un commerçant","err"); return; }
    if(mid) body.merchantId=parseInt(mid,10);
  }

  // Trigger-specific fields
  if(tt==="PRODUCT_PURCHASE"){ body.targetProductSkus=val("cmp_skus")||null; }
  if(tt==="VOLUME_THRESHOLD"){
    body.volumeThreshold=val("cmp_volumeThreshold")?parseFloat(val("cmp_volumeThreshold")):null;
    body.categoryFilter=val("cmp_categoryFilter")||null;
  }
  if(tt==="POS_WEBHOOK_EVENT"){
    body.amountThreshold=val("cmp_amountThreshold")?parseFloat(val("cmp_amountThreshold")):null;
  }
  if(tt==="MERCHANT_TRANSACTION"){
    body.categoryFilter=val("cmp_categoryFilter")||null;
    body.mccCode=val("cmp_mccCode")||null;
    body.channelFilter=val("cmp_channelFilter")||null;
    body.corridorFilter=val("cmp_corridorFilter")||null;
    body.cardBinStart=val("cmp_binStart")||null;
    body.cardBinEnd=val("cmp_binEnd")||null;
  }

  if(!body.name){ toast("Nom de la campagne requis","err"); return; }

  try{
    const method=draft.id?"PUT":"POST";
    const url=draft.id?`/api/campaigns/${draft.id}`:"/api/campaigns";
    await api(url,{method,body:JSON.stringify(body)});
    toast(t("saved_ok"),"ok");
    closeModal();
    window.__cmpDraft=null;
    renderCampaigns();
  }catch(e){
    let msg=String(e.message||e);
    try{ const parsed=JSON.parse(msg); if(parsed.error) msg=parsed.error; }catch(_){}
    toast(msg.slice(0,200),"err");
  }
}

}

function cloRewardLabel(o){
  if(!o.rewardType) return "—";
  const v = (o.rewardValue||0);
  if(o.rewardType==="CASHBACK_PERCENT") return `<span class="badge b-info">💰 ${v}% cashback</span>`;
  if(o.rewardType==="CASHBACK_FIXED") return `<span class="badge b-info">💰 ${v.toLocaleString("fr-FR")} FCFA</span>`;
  return `<span class="badge b-ok">⭐ ${v.toLocaleString("fr-FR")} points</span>`;
}

function cloStatusBadge(s){
  const map={DRAFT:{lbl:"Brouillon",cls:"b-muted"},ACTIVE:{lbl:"Active",cls:"b-ok"},PAUSED:{lbl:"Pause",cls:"b-warn"},EXPIRED:{lbl:"Expirée",cls:"b-muted"},ARCHIVED:{lbl:"Archivée",cls:"b-muted"}};
  const m=map[s]||{lbl:s,cls:"b-muted"};
  return `<span class="badge ${m.cls}">${m.lbl}</span>`;
}

async function cloOfferSave(id){
  const bins = Array.from(document.querySelectorAll(".clo_bin:checked")).map(x=>x.value).join(",");
  const merchantId = val("clo_merchant");
  const body = {
    name: val("clo_name"),
    description: val("clo_desc"),
    merchant: merchantId?{id:parseInt(merchantId,10)}:null,
    rewardType: document.getElementById("clo_rewardType").value,
    rewardValue: parseFloat(val("clo_rewardValue")||"0"),
    targetBins: bins||null,
    minTransactionAmount: val("clo_minTx")?parseFloat(val("clo_minTx")):null,
    maxRewardPerCardholder: val("clo_maxPerClient")?parseFloat(val("clo_maxPerClient")):null,
    totalBudget: val("clo_budget")?parseFloat(val("clo_budget")):null,
    channelFilter: val("clo_channel")||null,
    validFrom: val("clo_validFrom")||null,
    validTo: val("clo_validTo")||null
  };
  if(!body.name||!body.merchant){ toast("Nom et marchand requis","err"); return; }
  try{
    await api(id?`/api/clo/offers/${id}`:"/api/clo/offers",
      {method:id?"PUT":"POST", body:JSON.stringify(body)});
    toast("Offre enregistrée","ok"); closeModal(); renderCloOffers();
  }catch(e){ let m=String(e.message||e); try{const j=JSON.parse(m);if(j.error)m=j.error}catch(_){} toast(m.slice(0,200),"err"); }
}

function vouTypeBadge(t){
  const map = {
    PROGRESSIVE_LOYALTY: {label:"Fidélité progressive", cls:"b-info", icon:"🎯"},
    ONE_SHOT: {label:"One-shot", cls:"b-ok", icon:"⚡"},
    WELCOME: {label:"Bienvenue", cls:"b-info", icon:"👋"},
    BIRTHDAY: {label:"Anniversaire", cls:"b-warn", icon:"🎂"},
    PARTNER_CAMPAIGN: {label:"Partenaire", cls:"b-muted", icon:"🤝"}
  };
  const m = map[t] || {label:t, cls:"b-muted", icon:"?"};
  return `<span class="badge ${m.cls}">${m.icon} ${m.label}</span>`;
}

function vouStatusBadge(s){
  const map = {
    ISSUED: {label:"Émis", cls:"b-info"},
    CONSUMED: {label:"Consommé", cls:"b-ok"},
    EXPIRED: {label:"Expiré", cls:"b-muted"},
    CANCELLED: {label:"Annulé", cls:"b-danger"}
  };
  const m = map[s] || {label:s, cls:"b-muted"};
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function vouValueLabel(v){
  if(!v.valueType) return "—";
  if(v.valueType==="FREE_PRODUCT") return "🎁 Gratuit";
  if(v.valueType==="PERCENTAGE_DISCOUNT") return `${v.value||0} %`;
  return `${(v.value||0).toLocaleString("fr-FR")} FCFA`;
}

  document.getElementById("inboxBody").innerHTML = rows.length ? rows.map(r=>`
    <tr>
      <td class="strong">${esc(r.merchantName||"—")}</td>
      <td>${esc(r.subject||"—")}</td>
      <td>${reqTypeBadge(r.type)}</td>
      <td>${reqStatusBadge(r.status)}</td>
      <td style="color:var(--text-2);font-size:12px;white-space:nowrap">${dt(r.createdAt)}</td>
      <td class="row-actions">
        <button class="mini-btn" onclick="reqView(${r.id})">Voir</button>
        ${r.status!=="RESPONDED"&&r.status!=="CLOSED"?`<button class="mini-btn" onclick="reqRespond(${r.id})">Répondre</button>`:""}
      </td>
    </tr>`).join("") : `<tr><td colspan="6">${emptyFull()}</td></tr>`;
}

function reqTypeBadge(t){
  const map={
    CAMPAIGN_REQUEST:{icon:"📣",label:"Campagne",cls:"b-info"},
    QUESTION:{icon:"❓",label:"Question",cls:"b-ok"},
    SUPPORT:{icon:"🛠️",label:"Support",cls:"b-warn"},
    OTHER:{icon:"💬",label:"Autre",cls:"b-muted"}
  };
  const m=map[t]||map.OTHER;
  return `<span class="badge ${m.cls}">${m.icon} ${m.label}</span>`;
}

function reqStatusBadge(s){
  const map={
    OPEN:{label:"Nouvelle",cls:"b-info"},
    IN_PROGRESS:{label:"En cours",cls:"b-warn"},
    RESPONDED:{label:"Répondue",cls:"b-ok"},
    CLOSED:{label:"Fermée",cls:"b-muted"}
  };
  const m=map[s]||{label:s,cls:"b-muted"};
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function reqModal(presetType){
  const types = [
    {code:"CAMPAIGN_REQUEST", icon:"📣", label:"Demander une campagne", desc:"Vous voulez qu'Afriland crée une campagne cashback pour votre boutique."},
    {code:"QUESTION", icon:"❓", label:"Poser une question", desc:"Vous avez besoin d'une information sur la plateforme."},
    {code:"SUPPORT", icon:"🛠️", label:"Signaler un problème", desc:"Quelque chose ne fonctionne pas comme prévu."},
    {code:"OTHER", icon:"💬", label:"Autre", desc:"Toute autre communication."}
  ];
  const selected = presetType || "CAMPAIGN_REQUEST";
  const body = `
    <div style="margin-bottom:14px;padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:13px;color:var(--text-2)">
      Envoyez un message à l'équipe Afriland. Vous verrez leur réponse dans cet onglet.
    </div>
    <div class="form-grid">
      <div class="field full">
        <label>Type de demande *</label>
        <select id="req_type">
          ${types.map(t=>`<option value="${t.code}" ${t.code===selected?"selected":""}>${t.icon} ${t.label}</option>`).join("")}
        </select>
      </div>
      <div class="field full">
        <label>Sujet *</label>
        <input id="req_subject" data-validate="name" placeholder="Ex: Campagne rentrée scolaire 2026" maxlength="200">
        <div class="field-error"></div>
      </div>
      <div class="field full">
        <label>Message détaillé *</label>
        <textarea id="req_message" rows="8" placeholder="Décrivez précisément votre demande. Pour une campagne : période souhaitée, produits/catégories, pourcentage envisagé, etc." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical" maxlength="4000"></textarea>
        <div class="field-error"></div>
        <div id="req_msgcount" style="font-size:11px;color:var(--muted);margin-top:4px;text-align:right">0 / 4000</div>
      </div>
    </div>`;
  openModal("Nouvelle demande à Afriland", body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="reqSend()">Envoyer</button>`);
  setTimeout(()=>{
    wireLiveValidation("#modalBack");
    // Live-count message
    const msg=document.getElementById("req_message"), count=document.getElementById("req_msgcount");
    if(msg && count){
      const update=()=>{ count.textContent=msg.value.length+" / 4000"; };
      msg.addEventListener("input", update);
      msg.addEventListener("input", ()=>{
        if(msg.value.trim().length<5){
          msg.classList.add("invalid");
          const e=msg.parentElement.querySelector(".field-error");
          if(e){ e.textContent="Au moins 5 caractères"; e.classList.add("show"); }
        } else {
          msg.classList.remove("invalid");
          const e=msg.parentElement.querySelector(".field-error");
          if(e){ e.classList.remove("show"); }
        }
      });
    }
  }, 50);
}

async function reqSend(){
  const subj=val("req_subject");
  const msg=document.getElementById("req_message").value.trim();
  const type=document.getElementById("req_type").value;
  if(!subj || subj.length<2){ toast("Sujet requis (2 caractères min)","err"); return; }
  if(msg.length<5){ toast("Message requis (5 caractères min)","err"); return; }
  try{
    await api("/api/partner-requests",{method:"POST",body:JSON.stringify({subject:subj,message:msg,type})});
    toast("Demande envoyée à Afriland","ok");
    closeModal();
    if(typeof CURRENT!=="undefined" && CURRENT==="partnerRequests") renderPartnerRequests();
  }catch(e){
    let m=String(e.message||e);
    try{ const j=JSON.parse(m); if(j.error) m=j.error; }catch(_){}
    toast(m.slice(0,200),"err");
  }
}

async function reqView(id){
  try{
    const r=await api("/api/partner-requests/"+id);
    if(!r) return;
    const isAdmin=ME.role==="ADMIN";
    const responseBlock = r.adminResponse
      ? `<div style="margin-top:16px;padding:14px;background:var(--surface-2);border-radius:10px;border-left:4px solid var(--ok)">
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Réponse d'Afriland — ${esc(r.responderUsername||"admin")} · ${dt(r.respondedAt)}</div>
          <div style="white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(r.adminResponse)}</div>
        </div>`
      : `<div style="margin-top:16px;padding:14px;background:var(--surface-2);border-radius:10px;color:var(--muted);font-size:13px">Pas encore de réponse d'Afriland.</div>`;
    const body=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div><span style="color:var(--muted);font-size:11px">Commerçant</span><br><strong>${esc(r.merchantName||"—")}</strong></div>
        <div><span style="color:var(--muted);font-size:11px">Envoyée par</span><br>${esc(r.senderUsername||"—")}</div>
        <div><span style="color:var(--muted);font-size:11px">Type</span><br>${reqTypeBadge(r.type)}</div>
        <div><span style="color:var(--muted);font-size:11px">Statut</span><br>${reqStatusBadge(r.status)}</div>
        <div style="grid-column:1/-1"><span style="color:var(--muted);font-size:11px">Reçue le</span><br>${dt(r.createdAt)}</div>
      </div>
      <div><span style="color:var(--muted);font-size:11px">Sujet</span></div>
      <h3 style="margin:4px 0 12px 0;font-size:16px">${esc(r.subject||"—")}</h3>
      <div style="padding:14px;background:var(--surface-2);border-radius:10px;white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(r.message||"")}</div>
      ${responseBlock}`;
    let footer = `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>`;
    if(isAdmin){
      footer += ` <button class="btn btn-primary" onclick="reqRespond(${r.id})">Répondre</button>`;
      if(r.status!=="CLOSED"){
        footer += ` <button class="btn btn-ghost" onclick="reqSetStatus(${r.id},'CLOSED')">Fermer la demande</button>`;
      }
    }
    openModal("Demande #"+r.id, body, footer);
  }catch(e){ toast("Erreur: "+e.message,"err"); }
}

function reqRespond(id){
  const body=`
    <div class="form-grid">
      <div class="field full">
        <label>Votre réponse au partenaire *</label>
        <textarea id="req_response" rows="10" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical" placeholder="Rédigez la réponse qui sera envoyée au partenaire." maxlength="4000"></textarea>
        <div class="field-error"></div>
      </div>
    </div>`;
  openModal("Répondre à la demande #"+id, body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="reqSendResponse(${id})">Envoyer la réponse</button>`);
}

async function reqSendResponse(id){
  const response=document.getElementById("req_response").value.trim();
  if(response.length<3){ toast("Réponse trop courte","err"); return; }
  try{
    await api("/api/partner-requests/"+id+"/respond",{method:"POST",body:JSON.stringify({response})});
    toast("Réponse envoyée","ok");
    closeModal();
    if(typeof CURRENT!=="undefined" && CURRENT==="adminInbox") renderAdminInbox();
  }catch(e){ toast(String(e.message||e).slice(0,200),"err"); }
}

async function reqSetStatus(id,status){
  if(!confirm(`Passer cette demande au statut ${status} ?`)) return;
  try{
    await api(`/api/partner-requests/${id}/status?status=${status}`,{method:"PUT"});
    toast("Statut mis à jour","ok");
    closeModal();
    if(typeof CURRENT!=="undefined" && CURRENT==="adminInbox") renderAdminInbox();
  }catch(e){ toast(String(e.message||e).slice(0,200),"err"); }
}

async function renderSubPartners(){
  const c=document.getElementById("content");
  c.innerHTML=`<div class="page">${head(t("subPartners"),t("sub_sub"),`<button class="btn btn-primary" onclick="subPartnerModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>${t("new_subpartner")}</button>`+refreshBtn())}
    <div class="table-wrap"><div class="table-toolbar"><span class="count-pill" id="spCp">—</span></div>
    <div class="table-scroll"><table><thead><tr><th>${t("m_name")}</th><th>${t("m_city")}</th><th>${t("m_phone")}</th><th>${t("m_status")}</th><th>${t("c_created")}</th><th style="text-align:right">${t("col_actions")}</th></tr></thead>
    <tbody id="spBody">${rowSkeleton(6,5)}</tbody></table></div></div></div>`;
  try{let rows=await api("/api/partner/sub-merchants");if(!Array.isArray(rows))rows=[];
    document.getElementById("spCp").textContent=rows.length+" "+t("items");
    document.getElementById("spBody").innerHTML=rows.length?rows.map(m=>{const nm=(m.name||m.brandName||"").replace(/'/g,"’");return `<tr><td class="strong">${esc(m.name||m.brandName)}</td><td>${esc(m.city||"—")}</td><td><span class="mono">${esc(m.phone||"—")}</span></td><td>${badge(m.status)}</td><td style="color:var(--text-2)">${dt(m.createdAt)}</td><td class="row-actions"><button class="mini-btn" onclick="subUserModal(${m.id},'${esc(nm)}')">${t("sp_access")}</button><button class="mini-btn danger" onclick="delSubPartner(${m.id},'${esc(nm)}')">${t("del")}</button></td></tr>`;}).join(""):`<tr><td colspan="6">${emptyFull()}</td></tr>`;
  }catch(e){document.getElementById("spBody").innerHTML=`<tr><td colspan="6">${emptyMini(t("err_load"))}</td></tr>`;}
}
function subPartnerModal(){
  openModal(t("new_subpartner"),
    merchantFormFields(null,{hideParent:true})+
    `<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px">${t("sp_login_section")}</div>
     <div class="form-grid">
       <div class="field"><label>${t("cp_username")}</label><input id="sp_username" placeholder="ex: orange-cm"></div>
       <div class="field full"><label>${t("cp_password")}</label><div style="display:flex;gap:8px"><input id="sp_password" type="text"><button type="button" class="btn btn-ghost" onclick="fillPw('sp_password')">${t("cp_generate")}</button></div><div class="hint">${t("pw_hint")}</div></div>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="submitSubPartner()">${t("save")}</button>`);
}
async function submitSubPartner(){
  const body=merchantBody();
  if(!body.name){toast(t("m_name"),"err");return;}
  const username=val("sp_username"),password=val("sp_password");
  if((username||password)&&(!username||password.length<8||!/[0-9]/.test(password))){toast(t("pw_hint"),"err");return;}
  try{
    const sub=await api("/api/partner/sub-merchants",{method:"POST",body:JSON.stringify(body)});
    if(username&&password){
      const subId=sub&&sub.id;
      const res=await api(`/api/partner/sub-merchants/${subId}/user`,{method:"POST",body:JSON.stringify({username:username,password:password,fullName:body.name,email:body.email,loginUrl:effectiveBase()+"/login.html"})});
      closeModal();
      showPartnerCredentials(body.name,username,password,{email:body.email,emailSent:res&&res.emailSent});
    }else{toast(t("merchant_created"),"ok");closeModal();renderSubPartners();}
  }catch(e){toast(String(e.message||e).slice(0,160),"err");}
}
function subUserModal(subId,name){
  openModal(t("sp_access_title")+" "+name,
    `<div class="form-grid">
       <div class="field"><label>${t("cp_username")}</label><input id="su_username"></div>
       <div class="field full"><label>${t("cp_password")}</label><div style="display:flex;gap:8px"><input id="su_password" type="text"><button type="button" class="btn btn-ghost" onclick="fillPw('su_password')">${t("cp_generate")}</button></div><div class="hint">${t("pw_hint")}</div></div>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="submitSubUser(${subId},'${esc(name)}')">${t("save")}</button>`);
}
async function submitSubUser(subId,name){
  const username=val("su_username"),password=val("su_password");
  if(!username||password.length<8||!/[0-9]/.test(password)){toast(t("pw_hint"),"err");return;}
  try{const res=await api(`/api/partner/sub-merchants/${subId}/user`,{method:"POST",body:JSON.stringify({username:username,password:password,fullName:name,loginUrl:effectiveBase()+"/login.html"})});
    showPartnerCredentials(name,username,password,{email:res&&res.email,emailSent:res&&res.emailSent});
  }catch(e){toast(String(e.message||e).slice(0,160),"err");}
}
async function delSubPartner(id,name){
  if(!confirm(t("sp_del_confirm")+"\n\n"+name))return;
  try{await api(`/api/partner/sub-merchants/${id}`,{method:"DELETE"});toast(t("sp_deleted"),"ok");renderSubPartners();}
  catch(e){toast(String(e.message||e).slice(0,140),"err");}
}

/* ============ SKELETON / EMPTY ============ */
function kpiSkeletons(n){return Array(n).fill(`<div class="kpi"><div class="sk sk-line" style="width:60%"></div><div class="sk" style="height:30px;width:50%;margin:10px 0"></div><div class="sk sk-line" style="width:40%"></div></div>`).join("");}
function skLines(n){return Array(n).fill('<div class="sk sk-line"></div>').join("");}
function rowSkeleton(cols,rows){return Array(rows).fill(`<tr>${Array(cols).fill('<td><div class="sk sk-line"></div></td>').join("")}</tr>`).join("");}
function emptyFull(){return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg><h4>${t("empty")}</h4><p>${t("empty_sub")}</p></div>`;}
function emptyMini(msg){return `<div class="empty" style="padding:30px 10px"><p>${esc(msg)}</p></div>`;}

/* ============ INTERACTIONS ============ */
function animateCounters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const target=Number(el.dataset.count);if(!target)return;
    const suf=el.dataset.suffix||"",dur=800,t0=performance.now();
    function step(now){const p=Math.min((now-t0)/dur,1),ease=1-Math.pow(1-p,3),val=Math.round(target*ease);el.textContent=nf.format(val)+(suf?(" "+suf):"");if(p<1)requestAnimationFrame(step);}
    el.textContent="0"+(suf?(" "+suf):"");requestAnimationFrame(step);
  });
}
function tableSearch(q){q=q.trim().toLowerCase();const tb=document.getElementById("tbody");if(!tb)return;tb.querySelectorAll("tr").forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?"":"none";});}
function filterNav(q){q=q.trim().toLowerCase();document.querySelectorAll(".nav-item").forEach(n=>{n.style.display=n.dataset.label.toLowerCase().includes(q)?"":"none";});document.querySelectorAll("[data-group]").forEach(g=>{const any=[...g.querySelectorAll(".nav-item")].some(n=>n.style.display!=="none");g.style.display=any?"":"none";});}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme"),next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);localStorage.setItem("t2c_theme",next);updateThemeIcon();}
function updateThemeIcon(){const dark=document.documentElement.getAttribute("data-theme")==="dark";document.getElementById("themeBtn").innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';}
function setLang(l){LANG=l;localStorage.setItem("t2c_lang",l);document.documentElement.lang=l;applyI18n();buildNav(ME.role||"DEFAULT");go(CURRENT,true);}
function applyI18n(){
  document.getElementById("logoutTxt").textContent=t("logout");
  document.getElementById("navSearch").placeholder=t("search_menu");
  document.getElementById("globalSearch").placeholder=t("search_page");
  if(ME){document.getElementById("sideRole").textContent=stLabel(ME.role);document.getElementById("tbRole").textContent=stLabel(ME.role);}
  updateDate();
}
function updateDate(){const d=new Date();document.getElementById("dateMain").textContent=d.toLocaleDateString(LANG==="fr"?"fr-FR":"en-US",{weekday:"long",day:"numeric",month:"long"});document.getElementById("dateSub").textContent=d.getFullYear();}
function openNav(){document.body.classList.add("nav-open");}
function closeNav(){document.body.classList.remove("nav-open");}
async function logout(){try{await api("/api/auth/logout",{method:"POST"});}catch(e){}location.href="/login.html";}
function toast(msg,type){const el=document.createElement("div");el.className="toast "+(type||"");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300);},3200);}
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id&&id!==CURRENT)go(id,true);});
boot();
</script>
</body>
</html>
